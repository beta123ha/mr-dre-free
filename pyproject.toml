[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrdre-baseline"
version = "0.2.0"
description = "Reproducible MR DRE baseline benchmark on Kaggle Free"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "diskcache>=5.6,<6",
    "openai>=2,<3",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
    "tenacity>=9,<10",
    "tqdm>=4.67,<5",
    "httpx>=0.27,<1",
    "ddgs>=9,<11",
    "beautifulsoup4>=4.12,<5",
    "pypdf>=5,<7",
    "mcp>=1.15,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
mrdre-baseline-generate = "mrdre_baseline.workflows.generate:main"
mrdre-baseline-evaluate = "mrdre_baseline.workflows.evaluate:main"
mrdre-baseline-compare = "mrdre_baseline.workflows.compare:main"
mrdre-baseline-search = "mrdre_baseline.services.search_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
